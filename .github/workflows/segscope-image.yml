name: SegScope image

on:
  pull_request:
    paths:
      - 'apps/segscope-viz/**'
      - '.github/workflows/segscope-image.yml'
  push:
    branches: [master]
    paths:
      - 'apps/segscope-viz/**'
      - '.github/workflows/segscope-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify result parsers and pinned runner
        working-directory: apps/segscope-viz
        run: |
          node scripts/check-imports.mjs
          python3 scripts/build-runner.py
          git diff --exit-code -- server/assets/runner.tar.gz
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for default-branch publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/segscope-viz
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/segscope-viz:0.3.0
            ghcr.io/${{ github.repository_owner }}/segscope-viz:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
